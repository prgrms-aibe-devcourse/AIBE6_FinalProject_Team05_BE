# Actuator/Prometheus/Grafana 로컬 실험용 오버레이 - 커밋 대상 아님.
# 기존 docker-compose.yml은 그대로 두고, 아래처럼 함께 실행한다:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# 앱은 컨테이너가 아니라 호스트에서 ./gradlew.bat bootRun 으로 직접 띄운다는 전제.
# host.docker.internal 로 호스트의 8080 포트(actuator/prometheus)를 스크랩한다.
services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pokade-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # named volume - 컨테이너 재생성에도 TSDB 데이터가 남도록(기존엔 볼륨 미지정으로 익명 볼륨에 저장돼 있었음)
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: pokade-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}"
    volumes:
      # named volume - 기존엔 볼륨 자체가 없어 컨테이너가 재생성될 때마다 데이터소스/대시보드가 통째로 사라졌음
      - grafana-data:/var/lib/grafana
      # 데이터소스/대시보드 provider 설정 - UI 수동 생성 대신 코드로 관리
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # 실제 대시보드 JSON 파일 - 위 provisioning/dashboards의 provider가 이 경로를 바라본다
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
