spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pokade}
    username: ${DB_USER:pokade}
    password: ${DB_PASSWORD:pokade}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
       mode: always
       encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

sync:
  enabled: false

# Actuator/Prometheus 로컬 실험용 - 커밋 대상 아님
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

scrydex:
  api-key: ${SCRYDEX_API_KEY:}
  team-id: ${SCRYDEX_TEAM_ID:}
  base-url: https://api.scrydex.com
  page-size: 100

pokade:
  ai:
    grade:
      model: ${OPENAI_GRADE_MODEL:gpt-4o}
  aws:
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET:}

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
    com: debug
