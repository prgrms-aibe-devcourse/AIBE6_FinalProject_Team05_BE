spring:
  application:
    name: Pokade
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:Pokade/.env[.properties]
      - optional:file:BE/Pokade/.env[.properties]
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/api/oauth2/callback/{registrationId}"
          kakao: # ← 추가
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/oauth2/callback/{registrationId}"
            client-authentication-method: client_secret_post
            scope:
              - account_email
            client-name: Kakao
        provider: # ← 추가 (registration과 같은 레벨)
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # Boot 4.0.7의 FlywayAutoConfiguration을 HibernateJpaConfiguration과 함께 쓰면 "Circular
  # depends-on relationship between 'flyway' and 'entityManagerFactory'"로 부팅 자체가
  # 실패한다(AspectJ/Actuator/spring-ai/open-in-view 조합 문제 아님, 여러 조합으로 재현 확인됨).
  # 그래서 이 자동설정은 끄고, FlywayMigrationListener가 환경 준비 시점에 Flyway를 빈 등록
  # 없이 직접 실행한다. baseline-on-migrate/baseline-version은 그 리스너가 이 값을 읽어 쓴다 —
  # 기존 schema.sql 시절 이미 만들어진 스키마(prod/로컬 dev 모두)를 재실행 없이 "이미 적용됨"으로
  # 인정시키는 값이다. V1__baseline_schema.sql이 그 스키마와 동일한 내용이라 안전하다.
  flyway:
    enabled: false
    baseline-on-migrate: true
    baseline-version: 1

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 70MB   # AI 등급 진단은 6장 필수 업로드 — 파일당 한도(10MB) × 6장을 여유있게 수용

server:
  tomcat:
    max-swallow-size: 70MB     # 요청 용량 초과로 거부될 때 Tomcat이 남은 본문을 완전히 버릴 수 있도록 요청 한도와 맞춤(기본 2MB로는 413 응답 전에 연결이 끊김)
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}            # .env(spring.config.import)로 주입 — 미설정 시 부팅 실패(fail-fast)
  access-expiration: 30m
  refresh-expiration: 14d      # 추가 (Spring Duration이 14d = 14일로 파싱)

app:
  cookie:
    secure: ${APP_COOKIE_SECURE:false} # 이미 코드가 참조 중인 값을 명시적으로 노출
  oauth2:
    redirect-base: ${APP_OAUTH2_REDIRECT_BASE:http://localhost:3000}

prometheus:
  base-url: ${PROMETHEUS_BASE_URL:http://localhost:9090}