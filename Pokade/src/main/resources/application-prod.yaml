spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}   # 기본값은 application.yaml과 동일, RDS 클래스에 맞춰 env로만 조정

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  sql:
    init:
      mode: never

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # 운영: Google OAuth credential은 기본값 없이 주입 강제 (미설정 시 부팅 실패 = fail-fast)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
          kakao: # ← 추가
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}

# 운영: refresh 쿠키 Secure 플래그 on (HTTPS 전송 강제) — dev는 기본값 false 유지
app:
  cookie:
    secure: true
  oauth2:
    redirect-base: ${APP_OAUTH2_REDIRECT_BASE:https://www.pokade.store}

# dev와 동일하게 :빈 기본값 유지 - 키가 없다고 앱 부팅 자체가 fail-fast하면 안 됨(배치가 아직
# 스케줄러/트리거로 연결되지 않아 부팅 시점에는 이 값이 쓰이지 않으므로).
scrydex:
  api-key: ${SCRYDEX_API_KEY:}
  team-id: ${SCRYDEX_TEAM_ID:}
  base-url: https://api.scrydex.com
  page-size: 100

toss:
  client-key: ${TOSS_CLIENT_KEY:}
  secret-key: ${TOSS_SECRET_KEY:}
  base-url: https://api.tosspayments.com

pokade:
  ai:
    grade:
      model: ${OPENAI_GRADE_MODEL:gpt-4o}
  aws:
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    region: ${AWS_REGION:ap-northeast-2}
    s3:
      bucket: ${AWS_S3_BUCKET}

# 어드민 지표 대시보드용 Prometheus 스크랩 엔드포인트. 앱 포트(8080)와 분리된 별도 포트로만 열어서,
# SecurityConfig의 permitAll 여부와 무관하게 이 포트를 인터넷에 노출하지 않는 한 외부 접근이 불가능하다.
# MANAGEMENT_ADDRESS: 앱이 EC2에 맨몸(java -jar)으로 뜨면 127.0.0.1(기본값) 유지,
# 앱 자체가 별도 도커 컨테이너로 뜨고 Prometheus가 다른 컨테이너에서 스크랩하면 0.0.0.0으로 바꾸고
# 대신 해당 포트를 호스트에 publish하지 않는 방식으로 막아야 한다(컨테이너 loopback은 서로 안 통한다).
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics

logging:
  level:
    root: info
    com: info
