spring:
  datasource:
    hikari:
      minimum-idle: 2   # 캐시된 테스트 컨텍스트마다 유휴 20개를 잡아 postgres max_connections 고갈(기본값=풀 크기)

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      mode: always
      data-locations: optional:classpath:no-data.sql

jwt:
  secret: test-only-jwt-secret-key-for-unit-tests-not-a-real-secret-1234567890
  access-expiration: 30m
