# 로컬 개발 전용 - 운영 서버(EC2)에서는 실행 금지. prod는 RDS(.env의 DB_HOST)를
# 직접 사용하므로 여기서 이 파일로 postgres를 띄우면 안 쓰는 컨테이너만 남는다.
services:
  postgres:
    image: postgres:17-alpine
    container_name: pokade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pokade}
      POSTGRES_USER: ${POSTGRES_USER:-pokade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokade}
      TZ: Asia/Seoul
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pokade} -d ${POSTGRES_DB:-pokade}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pokade-net

  redis:
    image: redis:7-alpine
    container_name: pokade-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pokade-net

volumes:
  postgres-data:
  redis-data:

networks:
  pokade-net:
    driver: bridge
