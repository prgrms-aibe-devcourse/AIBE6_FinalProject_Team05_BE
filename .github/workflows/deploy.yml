name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./Pokade
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pokade-backend:latest

  cleanup-old-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # :latest 태그 하나만 쓰다 보니 push할 때마다 새 다이제스트가 쌓이고 이전 것은
      # 태그 없이(untagged) 남아 GHCR 저장 용량을 계속 먹는다. 최신 4개만 남기고 정리.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: pokade-backend
          package-type: container
          min-versions-to-keep: 4
          token: ${{ secrets.GHCR_PAT }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: OPENAI_API_KEY
          # GHCR 로그인·이미지 pull이 실패하면 즉시 중단 — 새 이미지 없이 기존 컨테이너만
          # 삭제되어 서비스가 내려가는 것을 막는다(기본값 false라 명시 필요).
          script_stop: true
          script: |
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository_owner }}/pokade-backend:latest
            docker stop pokade-app || true
            docker rm pokade-app || true
            docker run -d --name pokade-app --network host --restart unless-stopped \
              --env-file ~/AIBE6_FinalProject_Team05_BE/Pokade/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e TZ=Asia/Seoul \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              ghcr.io/${{ github.repository_owner }}/pokade-backend:latest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
