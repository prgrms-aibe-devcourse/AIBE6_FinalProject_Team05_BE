name: Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: ./Pokade
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/pokade-backend:latest

  cleanup-old-images:
    needs: build-and-push
    runs-on: ubuntu-latest
    # GHCR_PAT(개인 액세스 토큰)로만 인증하고 GITHUB_TOKEN은 쓰지 않으므로 권한 불필요.
    permissions: {}
    steps:
      # :latest 태그 하나만 쓰다 보니 push할 때마다 새 다이제스트가 쌓이고 이전 것은
      # 태그 없이(untagged) 남아 GHCR 저장 용량을 계속 먹는다. 최신 4개만 남기고 정리.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: pokade-backend
          package-type: container
          min-versions-to-keep: 4
          token: ${{ secrets.GHCR_PAT }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    # SSH 시크릿(SSH_HOST/SSH_USER/SSH_KEY)만 쓰고 GITHUB_TOKEN은 쓰지 않으므로 권한 불필요.
    permissions: {}
    steps:
      # blue-green 배포. 두 슬롯(a/b)을 번갈아 쓰고, 새 슬롯이 헬스체크를 통과한 뒤에만
      # nginx 업스트림을 전환하고 이전 슬롯을 내린다 — 컨테이너 교체 사이의 다운타임(약
      # 30초)이 없어진다. EC2에 사전 설정(nginx upstream include, sudoers)이 1회 돼
      # 있어야 한다 — docs/troubleshooting/decisions/zero-downtime-blue-green-deploy.md 참고.
      - name: Deploy to EC2 (blue-green)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: OPENAI_API_KEY
          # 이미지 pull·헬스체크가 실패하면 즉시 중단 — 기존 컨테이너와
          # nginx 설정을 건드리지 않은 채로 배포만 실패한다(기본값 false라 명시 필요).
          script_stop: true
          # 임시 디버깅용 - 배포 스크립트 시작 직후 SSH 세션이 원인 불명으로
          # 조기 종료되는 문제의 실제 원인(타임아웃/keepalive/네트워크 리셋 등)을
          # SSH 클라이언트 레벨 로그로 확인하기 위함. 원인 파악되면 제거할 것.
          debug: true
          script: |
            # GHCR 로그인은 매 배포마다 하지 않는다 — docker login은 자격증명을
            # ~/.docker/config.json에 영구 저장하므로 EC2가 한 번만 로그인해두면
            # 이후 pull엔 재로그인이 불필요하다. 매번 반복하면 SSH exec로 매번
            # 전송되는 스크립트에 시크릿 처리 줄이 하나 더 늘어날 뿐이라 제거함.
            # GHCR_PAT가 회전되면 EC2에서 수동으로 한 번만 다시 로그인해야 한다:
            #   echo "$GHCR_PAT" | docker login ghcr.io -u <user> --password-stdin
            IMAGE=ghcr.io/${{ github.repository_owner }}/pokade-backend:latest
            IMAGE_BASE="${IMAGE%:latest}"

            # 롤백용 백업 2세대 유지: backup-1(직전) -> backup-2(그 이전), 3세대는 자동 dangling 처리되어 prune된다.
            docker image inspect "$IMAGE_BASE:backup-1" >/dev/null 2>&1 && \
              docker tag "$IMAGE_BASE:backup-1" "$IMAGE_BASE:backup-2"
            docker image inspect "$IMAGE" >/dev/null 2>&1 && \
              docker tag "$IMAGE" "$IMAGE_BASE:backup-1"

            docker pull "$IMAGE"

            CURRENT_SLOT=$(cat ~/pokade-active-slot 2>/dev/null || echo "")
            if [ "$CURRENT_SLOT" = "a" ]; then TARGET=b; else TARGET=a; fi
            if [ "$TARGET" = "a" ]; then APP_PORT=18080; MGMT_PORT=18180; else APP_PORT=18081; MGMT_PORT=18181; fi

            docker rm -f "pokade-app-$TARGET" 2>/dev/null || true
            docker run -d --name "pokade-app-$TARGET" \
              --network pokade_pokade-net \
              -p "${APP_PORT}:8080" \
              -p "127.0.0.1:${MGMT_PORT}:8081" \
              --restart unless-stopped \
              --env-file ~/AIBE6_FinalProject_Team05_BE/Pokade/.env \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e TZ=Asia/Seoul \
              -e OPENAI_API_KEY="$OPENAI_API_KEY" \
              -e REDIS_HOST=pokade-redis \
              -e MANAGEMENT_ADDRESS=0.0.0.0 \
              "$IMAGE"

            HEALTHY=false
            for i in $(seq 1 40); do
              if curl -fs "http://127.0.0.1:${MGMT_PORT}/actuator/health" > /dev/null; then
                HEALTHY=true
                break
              fi
              sleep 3
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "헬스체크 실패 — 신규 컨테이너(pokade-app-$TARGET) 제거, 기존 컨테이너 유지"
              docker logs --tail 100 "pokade-app-$TARGET" || true
              docker rm -f "pokade-app-$TARGET"
              exit 1
            fi

            echo "upstream pokade_upstream { server 127.0.0.1:${APP_PORT}; }" | sudo tee /etc/nginx/conf.d/pokade_upstream.conf > /dev/null
            sudo nginx -t
            # systemctl reload는 PAM/D-Bus를 거쳐 pty가 없으면 종료 상태를 잘못
            # 보고하고, pty를 켜면 그 pty를 docker login --password-stdin과 같은
            # stdin 소비 명령이 같이 써서 세션이 조기 종료되는 문제가 있었다.
            # 신호 기반 reload는 systemd/D-Bus/PAM을 아예 안 거치므로 pty 자체가
            # 필요 없다 — docs/troubleshooting/decisions/ssh-action-systemctl-reload-exit-status.md
            sudo nginx -s reload

            if [ -n "$CURRENT_SLOT" ]; then
              docker rm -f "pokade-app-$CURRENT_SLOT" 2>/dev/null || true
            else
              docker rm -f pokade-app 2>/dev/null || true
            fi

            echo "$TARGET" > ~/pokade-active-slot

            # 미사용(dangling) 이미지 정리 - EC2 로컬 디스크가 무한정 쌓이는 걸 방지.
            # GHCR 쪽 정리(cleanup-old-images job)는 레지스트리만 청소하고 로컬 pull 이미지는
            # 안 지워서, 배포를 반복할수록 디스크가 가득 차 배포가 실패하는 문제가 있었다.
            # until=48h 필터를 쓰면 배포 주기(하루 여러 번)가 48시간보다 짧아 이미지가
            # 지워지기 전에 계속 쌓였다. -a는 태그 없는(dangling) 이미지만 지우고 현재
            # 실행 중인 이미지는 건드리지 않으므로 시간 제한 없이 매 배포마다 정리한다.
            # backup-1/backup-2는 태그가 있어 dangling이 아니므로 이 prune에 영향받지 않는다.
            docker image prune -af || true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
